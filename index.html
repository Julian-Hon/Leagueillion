<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A minimal League champion trivia prototype." />
    <title>Ashen Atlas — Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <p class="eyebrow">ASHEN ATLAS · PROTOTYPE</p>
      <h1>Name a champion from Demacia</h1>
      <p class="instruction">Enter one answer. A less obvious valid answer earns more Resonance.</p>
      <form id="answer-form" novalidate>
        <label class="sr-only" for="answer">Champion name</label>
        <input id="answer" name="answer" type="text" autocomplete="off" placeholder="Type a champion name" />
        <button type="submit">Submit</button>
      </form>
      <section id="result" class="result" aria-live="polite" hidden></section>
      <button id="again" class="again" type="button" hidden>Try another answer</button>
      <p class="disclaimer">Unofficial fan prototype. Riot Games does not endorse or sponsor this project.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
